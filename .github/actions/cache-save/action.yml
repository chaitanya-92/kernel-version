name: 'Save Cache'
description: ''

inputs:
  cache_path:
    description: 'Path where cache is saved'
    required: true
    type: string
  cache_key:
    description: 'Unique key for the cache'
    required: true
    type: string
  cache_bucket:
    description: 'The tag name for the release (e.g., general-cache)'
    required: true
    default: 'general-cache'
  github_token:
    description: 'GitHub Token'
    required: true
  compression_level:
    description: 'Compression level (0-9). 0 = No compression, 1 = Fast, 19 = Best.'
    required: false
    type: number
    default: 6
  working_dir:
    description: 'Path where .git folder exists (use only if you clone multiple repos)'
    required: false
    type: string
  debug:
    description: 'Enable Logs'
    required: false
    type: boolean
    default: false

runs:
  using: 'composite'
  steps:
    - name: Archive, Split, and Upload Cache
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TARGET_REPO: "${{ github.repository }}"
      run: |
        # Archive, Split, and Upload Cache
        set -euo pipefail
        if [ "${{ inputs.debug }}" = "true" ]; then set -x; fi
        
        if [ "${{ inputs.working_dir }}" != "" ]; then 
          cd "${{ inputs.working_dir }}"
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        TAG_NAME="${{ inputs.cache_bucket }}"
        BASE_FILENAME="cache-${{ inputs.cache_key }}"
        
        if [ "${{ inputs.compression_level }}" -eq 0 ]; then
          FILENAME="$BASE_FILENAME.tar"
        else
          FILENAME="$BASE_FILENAME.tzst"
        fi

        ensure_release() {
          local tag_name=$1
          git fetch --tags --force
          if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
            echo "Tag '$tag_name' not found. Creating backdated release..."
            GIT_COMMITTER_DATE="2015-01-01T12:00:00" git tag -a "$tag_name" -m "General Cache Storage"
            git push origin "$tag_name" --force || echo "Push failed, tag may exist from a parallel job."
            gh release create "$tag_name" --title "General Cache" --notes "Automated storage for build assets" --repo "$TARGET_REPO" || true
          fi
          local attempts=0
          until gh release view "$tag_name" --repo "$TARGET_REPO" >/dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "::warning::Release '$tag_name' is not visible after creation. Skipping cache upload."
              return 0
            fi
            echo "  Waiting for release to propagate (attempt $attempts/20)..."
            sleep 5
          done
          gh release edit "$tag_name" --latest=false --repo "$TARGET_REPO" >/dev/null 2>&1 || true
        }

        upload_with_retry() {
          local file=$1
          local max_attempts=6
          local timeout_duration="15m"
          local quiet_upload=true
          [ "${{ inputs.debug }}" = "true" ] && quiet_upload=false

          for ((i=1; i<=max_attempts; i++)); do
            echo "  Attempt $i/$max_attempts for $(basename "$file") ($(du -h "$file" | cut -f1))..."
            set +e
            if [ "$quiet_upload" = "true" ] && [ "$i" -lt "$max_attempts" ]; then
              timeout "$timeout_duration" gh release upload "$TAG_NAME" "$file" --clobber --repo "$TARGET_REPO" >/dev/null 2>&1
            else
              timeout "$timeout_duration" gh release upload "$TAG_NAME" "$file" --clobber --repo "$TARGET_REPO"
            fi
            local exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              echo "  Successfully uploaded $(basename "$file")"
              return 0
            fi
            if [ "$exit_code" -eq 124 ]; then
              echo "  ⚠ Attempt $i timed out after $timeout_duration."
            else
              echo "  ⚠ Attempt $i failed (exit $exit_code)."
            fi
            if [ "$i" -lt "$max_attempts" ]; then
              local backoff=$(( 10 * i ))
              echo "  Retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done
          return 1
        }
        
        echo "::group:: Checking Release State"
        RELEASE_READY=true
        ensure_release "$TAG_NAME" || RELEASE_READY=false
        if [ "$RELEASE_READY" = "false" ]; then
          echo "⚠️ Skipping cache upload - release not available."
          echo "::endgroup::"
          exit 0
        fi
        echo "Release '$TAG_NAME' is ready for upload."
        echo "::endgroup::"
        
        echo "::group:: Archiving Path"
        echo "Target: ${{ inputs.cache_path }}"
        
        if [ ! -d "${{ inputs.cache_path }}" ] && [ ! -f "${{ inputs.cache_path }}" ]; then
          echo "⚠️ Target path not found. Skipping cache save."
          echo "::endgroup::"
        else
          DIR_NAME=$(dirname "${{ inputs.cache_path }}")
          BASE_NAME=$(basename "${{ inputs.cache_path }}")
          
          if [ "${{ inputs.debug }}" = "true" ]; then
            if [ "${{ inputs.compression_level }}" -eq 0 ]; then
              tar --posix -h -cvf "$FILENAME" -C "$DIR_NAME" "$BASE_NAME"
            else
              tar --posix -h -I "zstd -T0 -${{ inputs.compression_level }}" -cvf "$FILENAME" -C "$DIR_NAME" "$BASE_NAME"
            fi
          else
            if [ "${{ inputs.compression_level }}" -eq 0 ]; then
              tar --posix -h -cvf "$FILENAME" -C "$DIR_NAME" "$BASE_NAME" > /dev/null 2>&1
            else
              tar --posix -h -I "zstd -T0 -${{ inputs.compression_level }}" -cvf "$FILENAME" -C "$DIR_NAME" "$BASE_NAME" > /dev/null 2>&1
            fi
          fi
          
          FILE_SIZE=$(stat -c%s "$FILENAME")
          echo "Archive created: $FILENAME ($FILE_SIZE bytes)"
          echo "::endgroup::"
          
          echo "::group:: Uploading Assets"
          # GitHub release assets are limited to 2GB; split earlier so uploads finish within timeout.
          SPLIT_THRESHOLD=800000000   # 800MB
          GITHUB_MAX_SIZE=2000000000  # ~1.86GB hard limit
          SPLIT_CHUNK=750M

          echo "Removing previous assets for ${BASE_FILENAME}* (if any)..."
          mapfile -t OLD_ASSETS < <(gh release view "$TAG_NAME" --repo "$TARGET_REPO" --json assets --jq -r ".assets[].name | select(startswith(\"${BASE_FILENAME}\"))" 2>/dev/null || true)
          for asset in "${OLD_ASSETS[@]}"; do
            [ -z "$asset" ] && continue
            gh release delete-asset "$TAG_NAME" "$asset" --repo "$TARGET_REPO" -y >/dev/null 2>&1 || true
          done

          if [ "$FILE_SIZE" -gt "$SPLIT_THRESHOLD" ] || [ "$FILE_SIZE" -gt "$GITHUB_MAX_SIZE" ]; then
            echo "Archive is $((FILE_SIZE / 1024 / 1024))MB — splitting into ${SPLIT_CHUNK} chunks for reliable upload..."
            split -b "$SPLIT_CHUNK" -a 2 "$FILENAME" "${FILENAME}.part"
            for part in "${FILENAME}".part*; do
              echo "Uploading $(basename "$part")..."
              if ! upload_with_retry "$part"; then
                echo "::error::Failed to upload part $part after multiple attempts."
                exit 1
              fi
              rm -f "$part"
            done
            rm -f "$FILENAME"
          else
            echo "Archive is $((FILE_SIZE / 1024 / 1024))MB — uploading as a single file..."
            if ! upload_with_retry "$FILENAME"; then
              echo "::error::Failed to upload $FILENAME after multiple attempts."
              exit 1
            fi
            rm -f "$FILENAME"
          fi
          # Cleanup any leftover archive artifacts (single-file or split parts)
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "Cleaning archive artifacts: ${BASE_FILENAME}*"
          fi
          rm -f "${BASE_FILENAME}"* || true

          echo "::endgroup::"
        fi